[package]
name = "out-of-context"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"

[dependencies]
# LLM Integration
llama-cpp-2 = "0.1.153"

# CLI Argument Parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP Downloads
# rustls instead of the default native-tls: openssl-sys cannot cross-compile to
# aarch64 without an ARM libssl in the build image.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "stream",
    "rustls-tls",
] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }

# Progress Bar
indicatif = "0.17"

# Error Handling
anyhow = "1.0"

# Token decoding (same version llama-cpp-2 uses internally)
encoding_rs = "0.8"

# Timestamps in the memory log
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Async Utilities (for download streaming)
futures-util = "0.3"

[features]
# Development only: lets the dev box offload to a GPU so prompt and framing
# experiments run in seconds instead of minutes. Never used for the board.
vulkan = ["llama-cpp-2/vulkan"]

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols from binary
panic = "abort"        # Smaller binary, no unwinding
